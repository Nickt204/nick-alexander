<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork Portfolio Preview</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070707;
        color: #f3f3f3;
        line-height: 1.6;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .page {
        max-width: 1250px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }
      .hero,
      .about,
      .contact,
      .work {
        margin-bottom: 48px;
      }
      .hero {
        display: grid;
        gap: 28px;
      }
      @media (min-width: 900px) {
        .hero {
          grid-template-columns: 1.05fr 0.95fr;
          align-items: center;
        }
      }
      .hero-copy p.tagline {
        display: inline-flex;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(20, 20, 20, 0.9);
        border-radius: 999px;
        font-size: 0.92rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c4c4c4;
      }
      .hero-copy h1 {
        margin: 24px 0 18px;
        font-size: clamp(2.8rem, 3.8vw, 4.8rem);
        line-height: 0.96;
      }
      .hero-copy p.description {
        max-width: 680px;
        color: #cfcfcf;
      }
      .hero-copy .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 26px;
      }
      .button,
      .button a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 16px 24px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
        background: #111;
        color: #f7f7f7;
      }
      .button:hover,
      .button a:hover {
        background: #1f1f1f;
      }
      .button-outline {
        border-color: rgba(255, 255, 255, 0.16);
        background: transparent;
      }
      .hero-card {
        position: relative;
        overflow: hidden;
        border-radius: 30px;
        min-height: 480px;
        background: linear-gradient(180deg, rgba(251,191,36,0.18), rgba(59,130,246,0.05));
      }
      .hero-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .hero-card-info {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        padding: 20px;
        border-radius: 24px;
        background: rgba(0, 0, 0, 0.55);
      }
      .hero-card-info p {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.85rem;
        color: #c2c2c2;
      }
      .hero-card-info h2 {
        margin: 0;
        font-size: 1.85rem;
      }
      .work .section-heading {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-end;
        margin-bottom: 28px;
      }
      .work .section-heading h2 {
        margin: 6px 0 0;
        font-size: clamp(2.2rem, 3vw, 3.2rem);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 24px;
      }
      .filters button {
        border: 1px solid #333;
        background: #111;
        color: #e6e6e6;
        border-radius: 999px;
        padding: 10px 18px;
      }
      .filters button.active {
        background: #f7f7f7;
        color: #111;
      }
      .artwork-grid {
        display: grid;
        gap: 22px;
      }
      @media (min-width: 860px) {
        .artwork-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 1200px) {
        .artwork-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .artwork-card {
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: #0f0f0f;
      }
      .artwork-card img {
        width: 100%;
        display: block;
        height: 230px;
        object-fit: cover;
      }
      .artwork-card-body {
        padding: 22px;
      }
      .artwork-card h3 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      .artwork-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        color: #a2a2a2;
      }
      .artwork-card p {
        margin: 0;
        color: #ccc;
      }
      .about,
      .contact {
        background: #0d0d0d;
        padding: 28px;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.08);
      }
      .about h2,
      .contact h2 {
        margin: 14px 0 18px;
        font-size: 2.3rem;
      }
      .about p,
      .contact p {
        margin: 0 0 16px;
        color: #d7d7d7;
      }
      .contact-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .section-header-small {
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: #fbbf24;
        font-size: 0.8rem;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 999px;
        border: 1px solid #333;
        background: #0b0b0b;
        color: #f3f3f3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useMemo, useState, cloneElement, isValidElement } = React;

      function Button({ asChild, variant, className = "", children, ...props }) {
        const classes = ["button", variant === "outline" ? "button-outline" : "", className].filter(Boolean).join(" ");
        if (asChild && isValidElement(children)) {
          return cloneElement(children, {
            className: [classes, children.props.className || ""].filter(Boolean).join(" "),
            ...props,
          });
        }
        return (
          <button className={classes} {...props}>
            {children}
          </button>
        );
      }

      function Card({ className = "", children, ...props }) {
        return (
          <div className={["artwork-card", className].filter(Boolean).join(" ")} {...props}>
            {children}
          </div>
        );
      }

      function CardContent({ className = "", children, ...props }) {
        return (
          <div className={["artwork-card-body", className].filter(Boolean).join(" ")} {...props}>
            {children}
          </div>
        );
      }

      const artworks = [
        {
          title: "Stairway to Tomorrow",
          year: "2026",
          medium: "Acrylic on canvas",
          category: "Painting",
          image: "images/stairway_to_day_break%20copy.webp",
          description: "A layered abstract composition exploring sunset light, movement, memory, and the lingering feeling of staying awake until sunrise.",
        },
        {
          title: "Signal Drift",
          year: "2025",
          medium: "Digital illustration",
          category: "Digital",
          image: "images/Chroma%20Crumble.webp",
          description: "A moody digital piece exploring memory, movement, and fragments of light.",
        },
        {
          title: "Quiet Room",
          year: "2025",
          medium: "Mixed media",
          category: "Mixed Media",
          image: "images/Eden%20Collapse.webp",
          description: "Texture-heavy composition inspired by stillness, domestic space, and silence.",
        },
        {
          title: "Gold Hour Study",
          year: "2024",
          medium: "Oil pastel",
          category: "Drawing",
          image: "images/arcadian_shift%20copy.webp",
          description: "Warm tones and loose marks capture the feeling of late afternoon light.",
        },
        {
          title: "Blue Figure",
          year: "2024",
          medium: "Ink and wash",
          category: "Drawing",
          image: "images/carousel.webp",
          description: "A minimal figurative work balancing negative space with expressive line.",
        },
        {
          title: "Afterimage",
          year: "2023",
          medium: "Digital collage",
          category: "Digital",
          image: "images/paradise.webp",
          description: "Layered collage using bold shapes, visual noise, and dreamlike color.",
        },
      ];

      const categories = ["All", "Painting", "Digital", "Mixed Media", "Drawing"];

      function filterArtworks(items, selectedCategory, query) {
        const normalizedQuery = query.trim().toLowerCase();
        return items.filter((art) => {
          const matchesCategory = selectedCategory === "All" || art.category === selectedCategory;
          const searchableText = `${art.title} ${art.medium} ${art.description} ${art.category} ${art.year}`.toLowerCase();
          const matchesQuery = normalizedQuery === "" || searchableText.includes(normalizedQuery);
          return matchesCategory && matchesQuery;
        });
      }

      function ArtworkPortfolio() {
        const [selectedCategory, setSelectedCategory] = useState("All");
        const [query, setQuery] = useState("");

        const filteredArtworks = useMemo(
          () => filterArtworks(artworks, selectedCategory, query),
          [selectedCategory, query]
        );

        return (
          <div className="page">
            <section className="hero">
              <div className="hero-copy">
                <p className="tagline">Contemporary artwork, personal experiments, and visual stories</p>
                <h1>Artwork with texture, feeling, and a little beautiful chaos.</h1>
                <p className="description">
                  A curated portfolio of paintings, drawings, digital pieces, and mixed-media work. Replace these sample pieces with your own images and descriptions.
                </p>
                <div className="button-row">
                  <Button asChild>
                    <a href="#work">View the work</a>
                  </Button>
                  <Button asChild variant="outline">
                    <a href="#contact">Get in touch</a>
                  </Button>
                </div>
              </div>
              <div className="hero-card">
                <img src="images/utopia.webp" alt="Featured artwork" />
                <div className="hero-card-info">
                  <p>Featured</p>
                  <h2>Midnight Bloom</h2>
                </div>
              </div>
            </section>

            <section id="work" className="work">
              <div className="section-heading">
                <div>
                  <p className="section-header-small">Selected Work</p>
                  <h2>Gallery</h2>
                </div>
                <div style={{ width: "100%", maxWidth: "420px" }}>
                  <input
                    type="text"
                    value={query}
                    onChange={(event) => setQuery(event.target.value)}
                    placeholder="Search artwork..."
                  />
                </div>
              </div>

              <div className="filters">
                {categories.map((category) => (
                  <button
                    key={category}
                    onClick={() => setSelectedCategory(category)}
                    className={selectedCategory === category ? "active" : ""}
                  >
                    {category}
                  </button>
                ))}
              </div>

              <div className="artwork-grid">
                {filteredArtworks.length > 0 ? (
                  filteredArtworks.map((art) => (
                    <Card key={art.title}>
                      <img src={art.image} alt={art.title} />
                      <CardContent>
                        <div className="artwork-meta">
                          <div>
                            <h3>{art.title}</h3>
                            <p>{art.medium} · {art.year}</p>
                          </div>
                          <span>{art.category}</span>
                        </div>
                        <p>{art.description}</p>
                      </CardContent>
                    </Card>
                  ))
                ) : (
                  <div style={{ padding: "28px", borderRadius: "24px", background: "#111", color: "#ccc" }}>
                    No artwork matched your search. Try a different title, medium, year, or category.
                  </div>
                )}
              </div>
            </section>

            <section id="about" className="about">
              <p className="section-header-small">About</p>
              <h2>The artist behind the work</h2>
              <p>
                I create artwork that blends emotion, texture, and visual storytelling. My practice moves between traditional and digital methods, often exploring atmosphere, identity, memory, and color.
              </p>
              <p>
                This portfolio is built to be easy to personalize: add your own bio, replace the images, update the artwork details, and link your socials or shop.
              </p>
            </section>

            <section id="contact" className="contact">
              <p className="section-header-small">Contact</p>
              <h2>Interested in commissions, prints, or collaborations?</h2>
              <div className="contact-actions">
                <Button asChild>
                  <a href="mailto:your.email@example.com">Email me</a>
                </Button>
                <Button asChild variant="outline">
                  <a href="https://instagram.com" target="_blank" rel="noreferrer">Instagram</a>
                </Button>
              </div>
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<ArtworkPortfolio />);
    </script>
  </body>
</html>
